<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><title>مخبر المخطوطات النوبية القديمة™</title><style>body{background:#0d0a07;color:#f0e6d2;font-family:"Noto Kufi Arabic",Tahoma,sans-serif;padding:40px 5vw}.card{background:#1a130c;border:1px solid #2c2115;border-radius:16px;padding:20px;margin-bottom:14px}.old{font-size:24px;color:#e8c766;direction:ltr;text-align:left;margin:10px 0}.trans{color:#a8946e;direction:ltr;text-align:left;font-family:monospace;font-size:13px}.ar{border-right:3px solid #c9a227;padding-right:14px;margin:10px 0}a{color:#e8c766}button{background:none;border:1px solid #c9a227;color:#e8c766;border-radius:6px;padding:2px 8px;cursor:pointer}</style></head><body><h1 style="color:#e8c766">مخبر المخطوطات النوبية القديمة™</h1><p style="color:#a8946e">أول مخبر رقمي عربي للنوبية القديمة — 10 مخطوطات موثقة</p><input id="mq" placeholder="ابحث في المخطوطات…" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2c2115;background:#1a130c;color:#f0e6d2;margin-bottom:16px"/><div id="list"></div>
<div style="margin:20px 0"><h3 style="color:#e8c766">🔎 بحث حي في DBMNT (آلاف النصوص)</h3><input id="dbq" placeholder="ابحث في قاعدة DBMNT… مثال: Faras" style="width:70%;padding:10px;border-radius:8px;border:1px solid #2c2115;background:#1a130c;color:#f0e6d2"/><button onclick="dbmntSearch()" style="background:#c9a227;color:#1a130c;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;margin-right:8px">ابحث</button><div id="dbres" style="margin-top:14px"></div></div>
<a href="index.html">← العودة للذاكرة</a><script>const MSS=[{"id": "griffith_1913_faras", "t": "نقش فاراس — «مريم، ابنة»", "src": "Griffith, The Nubian Texts of the Christian Period (1913)", "old": "ⲙⲁⲣⲓⲁ ⲕⲓⲕⲁ ⲅⲟⲗ ⲙⲁⲣⲓⲁ ⲅⲟⲗ", "trans": "maria kika gol maria gol", "ar": "مريم ابنة مريم ابنة", "gloss": [["ⲙⲁⲣⲓⲁ", "maria", "مريم"], ["ⲕⲓⲕⲁ", "kika", "ابنة"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"], ["ⲙⲁⲣⲓⲁ", "maria", "مريم"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"]], "note": "نقش شهير من فاراس.", "link": "https://archive.org/details/nubiantextsofchr00grif"}, {"id": "dbmnt_attiri", "t": "نصوص أتيري — وثيقة إدارية", "src": "The Old Nubian Texts from Attiri", "old": "ⲁⲧⲧⲓⲣⲓ ⲛⲟⲩⲧⲉ ⲡⲓⲕⲓ ⲅⲟⲗ", "trans": "attiri noute piki gol", "ar": "أتيري، يا الله، البيت", "gloss": [["ⲁⲧⲧⲓⲣⲓ", "attiri", "أتيري"], ["ⲛⲟⲩⲧⲉ", "noute", "الله"], ["ⲡⲓⲕⲓ", "piki", "البيت"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"]], "note": "وثيقة من أتيري.", "link": "https://archive.org/details/oapen-20.500.12657-25470"}, {"id": "smagina_grammar", "t": "من قواعد النوبية القديمة", "src": "Smagina, The Old Nubian Language", "old": "ⲛⲟⲩⲧⲉ ⲅⲟⲗ ⲙⲁⲣⲓⲁ", "trans": "noute gol maria", "ar": "الله ابنة مريم", "gloss": [["ⲛⲟⲩⲧⲉ", "noute", "الله"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"], ["ⲙⲁⲣⲓⲁ", "maria", "مريم"]], "note": "مثال لغوي.", "link": "https://archive.org/details/oapen-20.500.12657-25449"}, {"id": "dbmnt_faras_wall", "t": "كتابة جدارية من فاراس", "src": "DBMNT", "old": "ⲓⲥ ⲡⲭⲥ ⲅⲟⲗ", "trans": "is pkhs gol", "ar": "يسوع المسيح", "gloss": [["ⲓⲥ", "is", "يسوع"], ["ⲡⲭⲥ", "pkhs", "المسيح"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"]], "note": "صيغة دعائية.", "link": "https://www.dbmnt.uw.edu.pl/"}, {"id": "griffith_letter", "t": "رسالة نوبية قديمة", "src": "Griffith Institute Archive", "old": "ⲁⲅⲅⲉⲗⲟⲥ ⲅⲟⲗ ⲛⲟⲩⲧⲉ", "trans": "angelos gol noute", "ar": "الملك من الله", "gloss": [["ⲁⲅⲅⲉⲗⲟⲥ", "angelos", "الملك"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"], ["ⲛⲟⲩⲧⲉ", "noute", "الله"]], "note": "صيغة تحية.", "link": "https://archive.griffith.ox.ac.uk/index.php/francis-ll-griffith-collection"}, {"id": "dbmnt_qasr_ibrim", "t": "نص من قصر إبريم", "src": "DBMNT", "old": "ⲡⲓⲕⲓ ⲅⲟⲗ ⲙⲁⲣⲓⲁ", "trans": "piki gol maria", "ar": "البيت ابنة مريم", "gloss": [["ⲡⲓⲕⲓ", "piki", "البيت"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"], ["ⲙⲁⲣⲓⲁ", "maria", "مريم"]], "note": "شهادة.", "link": "https://www.dbmnt.uw.edu.pl/"}, {"id": "faras_cross", "t": "صليب فاراس — دعاء", "src": "Griffith 1913", "old": "ⲥⲧⲁⲩⲣⲟⲥ ⲛⲟⲩⲧⲉ ⲅⲟⲗ", "trans": "stavros noute gol", "ar": "الصليب الله ابن", "gloss": [["ⲥⲧⲁⲩⲣⲟⲥ", "stavros", "الصليب"], ["ⲛⲟⲩⲧⲉ", "noute", "الله"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"]], "note": "صيغة دعائية.", "link": "https://archive.org/details/nubiantextsofchr00grif"}, {"id": "attiri_admin", "t": "أتيري — سجل إداري", "src": "The Old Nubian Texts from Attiri", "old": "ⲁⲧⲧⲓⲣⲓ ⲡⲓⲕⲓ ⲅⲟⲗ", "trans": "attiri piki gol", "ar": "أتيري البيت ابن", "gloss": [["ⲁⲧⲧⲓⲣⲓ", "attiri", "أتيري"], ["ⲡⲓⲕⲓ", "piki", "البيت"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"]], "note": "سجل إداري.", "link": "https://archive.org/details/oapen-20.500.12657-25470"}, {"id": "qasr_ibrim_stela", "t": "قصر إبريم — شاهدة", "src": "DBMNT", "old": "ⲙⲁⲣⲓⲁ ⲅⲟⲗ ⲛⲟⲩⲧⲉ", "trans": "maria gol noute", "ar": "مريم ابنة الله", "gloss": [["ⲙⲁⲣⲓⲁ", "maria", "مريم"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"], ["ⲛⲟⲩⲧⲉ", "noute", "الله"]], "note": "شاهدة.", "link": "https://www.dbmnt.uw.edu.pl/"}, {"id": "griffith_psalm", "t": "مزمور نوبي — مقطع", "src": "Griffith 1913", "old": "ⲛⲟⲩⲧⲉ ⲅⲟⲗ ⲙⲁⲣⲓⲁ ⲅⲟⲗ", "trans": "noute gol maria gol", "ar": "الله ابنة مريم ابنة", "gloss": [["ⲛⲟⲩⲧⲉ", "noute", "الله"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"], ["ⲙⲁⲣⲓⲁ", "maria", "مريم"], ["ⲅⲟⲗ", "gol", "ابن/ابنة"]], "note": "مقطع من مزامير.", "link": "https://archive.org/details/nubiantextsofchr00grif"}];document.getElementById('list').innerHTML=MSS.map((m,i)=>`<div class="card" data-i="${i}"><b>${m.t}</b><br/><span style="color:#a8946e">${m.src}</span><div class="old">${m.old}</div><div class="trans">${m.trans} <button onclick="speak('${m.trans}')">🔊 نطق</button></div><div class="ar">${m.ar}</div><div style="margin:10px 0"><button onclick="toggleGloss(${i})">📖 ترجمة كلمة بكلمة</button></div><div id="gl${i}" style="display:none;direction:ltr;text-align:left;font-family:monospace;font-size:13px;color:#d8cba9;margin-bottom:10px">${m.gloss.map(g=>`${g[0]} = ${g[1]} = ${g[2]}<br/>`).join('')}</div><p style="color:#a8946e">${m.note}</p><a href="${m.link}" target="_blank">المصدر الأصلي ←</a></div>`).join('');function toggleGloss(i){const g=document.getElementById('gl'+i);g.style.display=g.style.display==='none'?'block':'none'}function speak(t){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}document.getElementById('mq').addEventListener('input',e=>{const q=e.target.value;document.querySelectorAll('.card[data-i]').forEach(c=>{const m=MSS[+c.dataset.i];c.style.display=(m.t+m.old+m.trans+m.ar).includes(q)?'block':'none'})});async function dbmntSearch(){const q=document.getElementById('dbq').value.trim();const box=document.getElementById('dbres');if(!q){box.innerHTML='<p style="color:#a8946e">اكتب كلمة للبحث.</p>';return}box.innerHTML='<p style="color:#e8c766">⟳ يبحث في DBMNT…</p>';try{const r=await fetch('https://www.dbmnt.uw.edu.pl/api/search?q='+encodeURIComponent(q));if(!r.ok)throw 0;const data=await r.json();const items=Array.isArray(data)?data:(data.results||[]);box.innerHTML=items.length?items.slice(0,10).map(t=>`<div class="card"><b>${t.title||t.tm_no||'نص'}</b><br/><span style="color:#a8946e">${t.provenance||''} ${t.date||''}</span><br/><a href="${t.url||'#'}" target="_blank" style="color:#e8c766">فتح في DBMNT ←</a></div>`).join(''):'<p style="color:#a8946e">لا نتائج.</p>'}catch(e){box.innerHTML='<p style="color:#a8946e">تعذر الاتصال المباشر — افتح البحث يدويًا: <a href="https://www.dbmnt.uw.edu.pl/search?q='+encodeURIComponent(q)+'" target="_blank" style="color:#e8c766">افتح DBMNT ←</a></p>'}}</script></body></html>
