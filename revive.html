<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><title>الذاكرة الناطقة</title><script type="module">import {Client} from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";window.__gc=Client;</script><style>body{background:#06060a;color:#f4f1ea;font-family:"Noto Sans Arabic",Tahoma,sans-serif}.wrap{max-width:800px;margin:0 auto;padding:40px 20px}h1{font-size:clamp(26px,5vw,44px);font-weight:900}h1 .g{color:#e8c987}.box{border:1px solid rgba(198,160,90,.25);border-radius:20px;padding:30px;margin-top:20px;background:rgba(255,255,255,.02)}.btn{padding:13px 26px;border-radius:999px;font-weight:700;cursor:pointer;border:none;font-family:inherit;background:linear-gradient(90deg,#e8c987,#c6a05a);color:#000;margin:6px}#stage{margin-top:20px;display:none;border:1px dashed rgba(198,160,90,.3);border-radius:16px;padding:18px;text-align:center}img,video{max-width:100%;border-radius:12px}.st{color:#e8c987;margin-top:10px}</style></head><body><div class="wrap"><h1>الذاكرة <span class="g">الناطقة</span></h1><p style="color:#b0aa9c">ارفع صورة الجد → يحييها LivePortrait → ويحكي قصته بصوت عربي طبيعي.</p><div class="box"><input type="file" id="pi" accept="image/*"/><br/><br/><button class="btn" onclick="go()">💎 أحيِ الصورة واحكِ قصته</button><button class="btn" style="background:transparent;border:1px solid rgba(198,160,90,.25);color:#f4f1ea" onclick="window.open('https://huggingface.co/spaces/KwaiVGI/LivePortrait','_blank')">فتح LivePortrait كاملًا</button><div id="stage"><div id="st" class="st"></div><div id="md"></div><div id="sy" style="text-align:right;line-height:2;margin-top:14px"></div><audio id="pl" controls style="width:100%;margin-top:12px;display:none"></audio></div></div></div><script>const TTS="https://api.streamelements.com/kappa/v2/speech?voice=Zeina&text=";function story(n){return `${n}، من أبناء النوبة، عاش على ضفاف النيل حيث تلتقي الذاكرة بالماء والنخيل. تنتقل حكايته عبر شبكة الذاكرة النوبية إلى الأجيال القادمة.`}async function speak(t){const p=document.getElementById('pl');try{const r=await fetch(TTS+encodeURIComponent(t));if(!r.ok)throw 0;const b=await r.blob();p.src=URL.createObjectURL(b);p.style.display='block';p.play()}catch(e){const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';speechSynthesis.speak(u)}}async function go(){const i=document.getElementById('pi'),st=document.getElementById('stage'),s=document.getElementById('st'),m=document.getElementById('md'),sy=document.getElementById('sy'),p=document.getElementById('pl');st.style.display='block';m.innerHTML='';sy.innerHTML='';if(!i.files[0]){s.textContent='⚠️ ارفع صورة أولاً.';return}const file=i.files[0];const name=(file.name.replace(/\.[^.]+$/,'')).slice(0,30)||'الجد';const txt=story(name);s.textContent='⟳ يحيي الصورة عبر LivePortrait… ثم يحكي قصته';try{const {Client}=window.__gc;const app=await Client.connect("KwaiVGI/LivePortrait");const r=await app.predict("/predict",{image:file,video:null,flag_do_crop:true,flag_remake_cutout:false});const fv=(o)=>{if(!o)return null;if(typeof o==='string'&&/\.(mp4|webm)/.test(o))return o;if(Array.isArray(o)){for(const x of o){const r=fv(x);if(r)return r}}if(typeof o==='object'){for(const k in o){const r=fv(o[k]);if(r)return r}}return null};const v=fv(r.data);m.innerHTML=v?`<video src="${v}" controls autoplay loop muted style="max-width:100%"></video>`:`<img src="${URL.createObjectURL(file)}" style="max-width:100%"/>`}catch(e){s.textContent='تعذر الاتصال — فتحنا LivePortrait كاملًا.';m.innerHTML=`<img src="${URL.createObjectURL(file)}" style="max-width:100%"/>`;setTimeout(()=>window.open('https://huggingface.co/spaces/KwaiVGI/LivePortrait','_blank'),1500)}sy.innerHTML=`<div style="color:#c6a05a;font-size:11px;margin-bottom:8px">حكاية ${name}</div>${txt}<div style="font-size:11.5px;color:#c6a05a;margin-top:10px">📚 شبكة الذاكرة النوبية™ · صوت Amazon Polly (Zeina)</div>`;await speak(txt,p);s.textContent='✅ الصورة تتحرك + القصة تُروى — ذاكرة ناطقة كاملة'}</script></body></html>
