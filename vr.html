<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><title>الجولة الافتراضية</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/><script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script><style>body{margin:0;background:#06060a;overflow:hidden}#pano{position:fixed;inset:0}.hud{position:fixed;top:20px;right:20px;z-index:10;background:rgba(0,0,0,.6);border:1px solid rgba(198,160,90,.25);border-radius:999px;padding:10px 22px;color:#e8c987;font-size:14px}.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.6);border:1px solid rgba(198,160,90,.25);border-radius:999px;padding:10px 24px;color:#b0aa9c;font-size:13px}.info{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.75);border:1px solid rgba(198,160,90,.25);border-radius:18px;padding:18px 26px;max-width:520px;display:none}.info b{color:#e8c987}</style></head><body><div id="pano"></div><div class="hud">🏝️ جولة افتراضية · قرية نوبية · 360°</div><div class="hint">اسحب للنظر · اضغط النقاط الذهبية</div><div class="info" id="info"></div><script>const viewer=pannellum.viewer('pano',{type:"equirectangular",panorama:"https://pannellum.org/images/alma.jpg",autoLoad:true,autoRotate:-2,hfov:110,hotSpots:[{pitch:-5,yaw:20,type:"info",text:"🌴 نخيل النوبة",clickHandlerFunc:()=>show("🌴 النخيل","شاهد النخيل، واسمعه يحكي عن الظل والماء والحياة.")},{pitch:-5,yaw:120,type:"info",text:"🌊 نهر النيل",clickHandlerFunc:()=>show("🌊 النيل","النيل ليس ماءً فقط؛ إنه الذاكرة التي تسري في عروق النوبة.")},{pitch:-5,yaw:240,type:"info",text:"🏠 بيوت الطين",clickHandlerFunc:()=>show("🏠 البيوت","بيوت من الطين والنخيل، وفيها ولدت الحكايات والأغاني.")},{pitch:10,yaw:0,type:"info",text:"✨ الذاكرة",clickHandlerFunc:()=>show("✨ الذاكرة","كل زاوية هنا تحمل ذكرى.")}]});function show(t,x){const i=document.getElementById('info');i.innerHTML=`<b>${t}</b><br/>${x}`;i.style.display='block';setTimeout(()=>i.style.display='none',6000);const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=196;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+2.5);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+2.5)}</script></body></html>
